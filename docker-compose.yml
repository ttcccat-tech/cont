version: '3.8'

x-elastic-common: &elastic
  ELASTICSEARCH_URL: http://elasticsearch:9200
  LOGSTASH_HOST: logstash
  KIBANA_HOST: kibana

services:
  # ══════════════════════════════════════════════════════════
  #  Databases
  # ══════════════════════════════════════════════════════════
  cont-postgres:
    image: postgres:16-alpine
    container_name: cont-postgres
    restart: unless-stopped
    networks:
      - cont_default
    environment:
      POSTGRES_DB: cont
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  cont-redis:
    image: redis:7-alpine
    container_name: cont-redis
    restart: unless-stopped
    networks:
      - cont_default
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════════════════
  #  cont Admin API (Go Gin)
  # ══════════════════════════════════════════════════════════
  cont-admin-api:
    build:
      context: ./admin-api
      dockerfile: Dockerfile
    container_name: cont-admin-api
    restart: unless-stopped
    networks:
      - cont_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://cont-admin-api:8001/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      ADMIN_PORT: "8001"
      API_PORT: "8001"
      PROXY_PORT: "8000"
      POSTGRES_URL: "postgres://kong:kongpass@cont-postgres:5432/cont?sslmode=disable"
      REDIS_URL: "cont-redis:6379"
      PROXY_METRICS_URL: "http://cont-proxy:8000/metrics"
      JWT_SECRET: ${JWT_SECRET:-cont-dev-jwt-secret-change-in-prod}
      CONT_URL: ${CONT_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_YEARLY: ${STRIPE_PRICE_ENTERPRISE_YEARLY:-}
    ports:
      - "18081:8001"
    depends_on:
      cont-postgres:
        condition: service_healthy
      cont-redis:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════
  #  cont Proxy Engine (OpenResty)
  # ══════════════════════════════════════════════════════════
  cont-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: cont-proxy
    restart: unless-stopped
    networks:
      - cont_default
    ports:
      - "18000:8000"
    volumes:
      - ./elk/proxy_logs:/var/log/cont
    environment:
      - LUA_PACKAGE_PATH=/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;./?.lua;./?/init.lua
    depends_on:
      cont-admin-api:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════
  #  cont Frontend (React + Nginx)
  # ══════════════════════════════════════════════════════════
  cont-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KONG_BASE: /api
        VITE_API_BASE: /api
    container_name: cont-frontend
    restart: unless-stopped
    networks:
      - cont_default
    ports:
      - "18082:80"
    depends_on:
      - cont-admin-api

  # ══════════════════════════════════════════════════════════
  #  ELK Stack — Access Log 儲存與查詢
  # ══════════════════════════════════════════════════════════

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: cont-elasticsearch
    restart: unless-stopped
    networks:
      - cont_default
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=cont-elk
      - node.name=cont-es-01
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: cont-logstash
    restart: unless-stopped
    networks:
      - cont_default
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/proxy_logs:/var/log/cont:ro
    ports:
      - "15040:5044"
      - "19600:9600"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
      - XPACK_MONITORING_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: cont-kibana
    restart: unless-stopped
    networks:
      - cont_default
    ports:
      - "15601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"}'"]
      interval: 30s
      timeout: 10s
      retries: 10

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: cont-filebeat
    restart: unless-stopped
    networks:
      - cont_default
    user: root
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./elk/proxy_logs:/var/log/cont:ro
    command: filebeat -e -strict.perms=false
    depends_on:
      logstash:
        condition: service_started

networks:
  cont_default:
    external: true

volumes:
  postgres_data:
  elasticsearch_data:
