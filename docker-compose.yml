services:
  # ── Databases ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cont-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cont
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cont-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── cont Admin API (Go Gin) ───────────────────────────────────
  admin-api:
    build:
      context: ./admin-api
      dockerfile: Dockerfile
    container_name: cont-admin-api
    restart: unless-stopped
    networks:
      - cont_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      ADMIN_PORT: "8001"
      API_PORT: "8001"
      PROXY_PORT: "8000"
      POSTGRES_URL: "postgres://kong:kongpass@cont-postgres:5432/cont?sslmode=disable"
      REDIS_URL: "cont-redis:6379"
      JWT_SECRET: ${JWT_SECRET:-cont-dev-jwt-secret-change-in-prod}
      CONT_URL: ${CONT_URL:-}
    ports:
      - "18081:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── cont Proxy Engine (OpenResty) ────────────────────────────
  proxy:
    image: openresty/openresty:alpine
    container_name: cont-proxy
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./proxy/lua/cont:/usr/local/openresty/lualib/cont:ro
      - proxy_logs:/usr/local/openresty/nginx/logs
    ports:
      - "18000:8000"
    environment:
      - LUA_PACKAGE_PATH=/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;./?.lua;./?/init.lua
    depends_on:
      admin-api:
        condition: service_healthy

  # ── cont Frontend (React + Nginx) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KONG_BASE: /api
        VITE_API_BASE: /api
    container_name: cont-frontend
    restart: unless-stopped
    networks:
      - cont_default
    ports:
      - "18082:80"
    depends_on:
      - admin-api

networks:
  cont_default:
    external: true

volumes:
  postgres_data:
  proxy_logs: