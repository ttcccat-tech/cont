definitions:
  Service:
    type: object
    properties:
      id:
        type: string
        description: Unique identifier
      name:
        type: string
        description: Service name (unique)
      protocol:
        type: string
        enum: [http, https, tcp, tls]
        example: "http"
      host:
        type: string
        example: "example.com"
      port:
        type: integer
        example: 80
      path:
        type: string
        example: "/api"
      created_at:
        type: integer
        description: Unix timestamp
      updated_at:
        type: integer

  Route:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      service:
        type: object
        description: "Reference to service. Use either service.id or service.name"
        properties:
          id:
            type: string
          name:
            type: string
      protocols:
        type: array
        items:
          type: string
        example: ["http", "https"]
      hosts:
        type: array
        items:
          type: string
        example: ["example.com"]
      paths:
        type: array
        items:
          type: string
        example: ["/api"]
      methods:
        type: array
        items:
          type: string
        example: ["GET", "POST"]
      created_at:
        type: integer
      updated_at:
        type: integer

  Upstream:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      algorithm:
        type: string
        enum: [round-robin, consistent-hashing, least-connections]
        example: "round-robin"
      slots:
        type: integer
        description: Number of slots for consistent hashing
        example: 10000
      created_at:
        type: integer

  Target:
    type: object
    properties:
      id:
        type: string
      upstream_id:
        type: string
      target:
        type: string
        example: "192.168.1.100:8000"
      weight:
        type: integer
        description: Load balancing weight
        example: 100
      created_at:
        type: integer

  Consumer:
    type: object
    properties:
      id:
        type: string
      username:
        type: string
        description: Unique username
      created_at:
        type: integer
      updated_at:
        type: integer

  Plugin:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
        description: Plugin name (e.g. "rate-limiting", "cors")
      service:
        type: object
        description: Associated service (optional)
        properties:
          id:
            type: string
          name:
            type: string
      consumer:
        type: object
        description: Associated consumer (optional)
        properties:
          id:
            type: string
          username:
            type: string
      config:
        type: object
        description: Plugin configuration (key-value)
        example:
          minute: 100
          policy: "local"
      created_at:
        type: integer
      updated_at:
        type: integer

  Workspace:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      created_at:
        type: integer