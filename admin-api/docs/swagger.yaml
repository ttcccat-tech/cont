swagger: "2.0"
info:
  title: Cont Admin API
  description: |
    Cont - Kong-compatible Admin API for managing services, routes, upstreams,
    consumers, plugins, and workspaces. Designed as a lightweight Kong Admin
    interface with JWT authentication.
  version: "0.1.0"
  contact:
    name: Cont Project
    url: https://github.com/ttcccat-tech/cont
host: "cont-admin-api:8001"
basePath: "/"
schemes:
  - http
  - https

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: "JWT token. Format: Bearer <token>"

paths:
  /status:
    get:
      summary: API status
      description: Returns API version, uptime, and database connectivity.
      responses:
        "200":
          description: OK
          schema:
            type: object
            properties:
              version:
                type: string
                example: "cont 0.1.0"
              uptime:
                type: integer
                example: 3600
              database:
                type: object
                properties:
                  reachable:
                    type: boolean

  /auth/login:
    post:
      summary: Login
      description: Authenticate with username and password to receive a JWT token.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
                example: "admin"
              password:
                type: string
                example: "admin123"
      responses:
        "200":
          description: Login successful
          schema:
            type: object
            properties:
              token:
                type: string
              expires_in:
                type: integer
        "401":
          description: Invalid credentials

  # ── Services ─────────────────────────────────────────────────────────────
  /services:
    get:
      summary: List services
      security:
        - Bearer: []
      parameters:
        - name: size
          in: query
          type: integer
          description: Page size (max 1000)
        - name: offset
          in: query
          type: integer
          description: Offset for pagination
      responses:
        "200":
          description: List of services
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: "#/definitions/Service"
              next:
                type: string
        "401":
          description: Unauthorized
    post:
      summary: Create service
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/Service"
      responses:
        "201":
          description: Service created
          schema:
            $ref: "#/definitions/Service"
        "400":
          description: Invalid request
        "409":
          description: Service already exists

  /services/{id}:
    get:
      summary: Get service
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Service details
          schema:
            $ref: "#/definitions/Service"
        "404":
          description: Not found
    put:
      summary: Update service (replace)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/Service"
      responses:
        "200":
          description: Updated
          schema:
            $ref: "#/definitions/Service"
        "404":
          description: Not found
    patch:
      summary: Update service (patch)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/Service"
      responses:
        "200":
          description: Updated
          schema:
            $ref: "#/definitions/Service"
        "404":
          description: Not found
    delete:
      summary: Delete service
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

