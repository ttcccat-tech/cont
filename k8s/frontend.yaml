apiVersion: apps/v1
kind: Deployment
metadata:
  name: cont-frontend
  namespace: cont
  labels:
    app: cont-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cont-frontend
  template:
    metadata:
      labels:
        app: cont-frontend
    spec:
      containers:
        - name: frontend
          image: cont-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: cont-frontend
  namespace: cont
spec:
  selector:
    app: cont-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP