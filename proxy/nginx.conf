# nginx.conf — cont Gateway
# OpenResty-based reverse proxy with Lua plugin chain

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    send_timeout 60s;
    keepalive_requests 1000;
    keepalive_timeout 65s;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript;

    # Cont: shared memory zones for metrics and rate limiting
    lua_shared_dict cont_metrics 10m;
    lua_shared_dict cont_rate_limit 10m;

    # Cont: init Lua modules (once at startup)
    init_by_lua_block {
        _G.cont = {
            services = {}, routes = {}, upstreams = {}, plugins = {}, targets = {},
            workers = {}, start_time = ngx.time(), config_loaded = false,
        }
    }

    # Per-worker init
    init_worker_by_lua_block {
        package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
        local pid = ngx.worker.pid()
        if _G.cont then
            _G.cont.workers[pid] = {
                pid = pid,
                start_time = ngx.time(),
                requests = 0,
            }
        end
    }

    # Cont: Admin API upstream
    # NOTE: use resolver in server block to handle Docker DNS dynamic resolution
    # For static resolution, we rely on /etc/hosts inside the container

    server {
        listen 8000;
        server_name _;

        # Docker DNS resolver for dynamic service discovery
        resolver 127.0.0.11 valid=5s ipv6=off;

        # CORS preflight — exact match /
        location = / {
            access_by_lua_block {
                local method = ngx.req.get_method()
                if method == "OPTIONS" then
                    local origin = ngx.var.http_origin or "*"
                    ngx.header["Access-Control-Allow-Origin"] = origin
                    ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                    ngx.header["Access-Control-Allow-Headers"] = "Content-Type, Authorization, Kong-Admin-Token, X-API-Key, X-Requested-With"
                    ngx.header["Access-Control-Allow-Credentials"] = "true"
                    ngx.header["Access-Control-Max-Age"] = "86400"
                    ngx.status = 204
                    ngx.exit(204)
                end
            }
            # Not OPTIONS — fall through to proxy
            content_by_lua_block { ngx.exit(ngx.OK) }
        }

# Cont: Internal Admin API proxy (for ngx.location.capture subrequests)
        location = /cont-admin-api {
            set $admin_api cont-admin-api:8001;
            proxy_pass http://$admin_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Kong-Admin-Token changeme;
        }

        # Cont: Admin API proxy (/cont-admin/* → cont-admin-api:8001)
        location ~ ^/cont-admin/(?<cont_path>.*) {
            set $admin_api cont-admin-api:8001;
            proxy_pass http://$admin_api/$cont_path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Kong-Admin-Token changeme;
        }

        # Cont: /status (Kong-compatible)
        location = /status {
            access_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "status")
                if not ok then
                    ngx.log(ngx.ERR, "cont.status require failed: ", err)
                end
            }
            content_by_lua_block {
                local ok, h = pcall(require, "status")
                if ok and h then
                    h()
                else
                    ngx.status = 500
                    ngx.say('{"message":"status handler error"}')
                end
            }
            header_filter_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
            }
            log_by_lua_block {
                -- metrics done in log phase
            }
        }

        # Cont: /metrics (Prometheus)
        location = /metrics {
            content_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "metrics")
                if not ok then
                    ngx.log(ngx.ERR, "cont.metrics failed: ", err)
                    ngx.status = 500
                    ngx.say('{"message":"metrics handler error"}')
                end
            }
        }

        # Cont: Proxy (all other routes — plugin chain)
        location / {
            # 0. Set Lua package path
            set_by_lua_block $lua_package_path {
                return "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;./?.lua;./?/init.lua;"
            }

            # 1. rewrite: URL normalization
            rewrite_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "rewrite")
                if not ok then
                    ngx.log(ngx.ERR, "cont.rewrite failed: ", err)
                end
            }

            # 2. access: plugin chain (auth, rate-limit, etc.)
            access_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "access")
                if not ok then
                    ngx.log(ngx.ERR, "cont.access failed: ", err)
                end
            }

            # 3. proxy
            set $admin_api cont-admin-api:8001;
            proxy_pass http://$admin_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 4. header_filter: plugin chain
            header_filter_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, hf = pcall(require, "header_filter")
                if ok and hf then
                    pcall(hf)
                else
                    ngx.log(ngx.ERR, "cont.header_filter failed: ", hf)
                end
            }

            # 5. body_filter: plugin chain
            body_filter_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "body_filter")
                if not ok then
                    -- silently ignore body_filter errors
                end
            }

            # 6. log: plugin chain + metrics
            log_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "log")
                if not ok then
                    ngx.log(ngx.ERR, "cont.log failed: ", err)
                end
            }
        }
    }
}
