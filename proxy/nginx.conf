# nginx.conf — cont Gateway
# OpenResty-based reverse proxy with Lua plugin chain

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Upstream keepalive for backend reuse
    upstream_keepalive 512;
    upstream_keepalive_timeout 60s;
    upstream_keepalive_requests 1000;

    # Proxy buffers
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    send_timeout 60s;
    keepalive_requests 1000;
    keepalive_timeout 65s;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript;

    # Cont: init Lua modules (once at startup)
    init_by_lua_block {
        -- Cont global registry
        cont = {
            services = {},   -- service_id -> service config
            routes   = {},   -- route_id  -> route config
            upstreams = {},  -- upstream_id -> upstream config
            plugins  = {},   -- plugin_id -> plugin config
            targets  = {},   -- upstream_id -> {target, weight}
            workers  = {},   -- keyed by worker pid
            start_time = ngx.time(),
        }
        -- Load cont core
        local ok, err = pcall(require, "cont.init")
        if not ok then
            ngx.log(ngx.ERR, "cont init failed: ", err)
        end
    }

    # Per-worker init
    init_worker_by_lua_block {
        local pid = ngx.worker.pid()
        cont.workers[pid] = {
            pid = pid,
            start_time = ngx.time(),
            requests = 0,
        }
        -- Start background timers (healthcheck, config sync)
        local ok, err = pcall(require, "cont.worker")
        if not ok then
            ngx.log(ngx.ERR, "cont worker init failed: ", err)
        end
    }

    # Cont: Admin API upstream
    upstream cont_admin {
        server 127.0.0.1:8001;
        keepalive 64;
    }

    server {
        listen 8000;
        server_name _;

        # Cont: Admin API proxy (/kong/* → 127.0.0.1:8001)
        location ~ ^/kong/(?<kong_path>.*) {
            proxy_pass http://cont_admin/$kong_path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Kong-Admin-Token changeme;
        }

        # Cont: /status (Kong-compatible)
        location = /status {
            access_by_lua_block {
                local ok, err = pcall(require, "cont.status")
                if not ok then
                    ngx.log(ngx.ERR, "cont.status failed: ", err)
                end
            }
            header_filter_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
            }
            body_filter_by_lua_block {
                -- handled by cont.status
            }
            log_by_lua_block {
                -- metrics done in log phase
            }
        }

        # Cont: /metrics (Prometheus)
        location = /metrics {
            access_by_lua_block {
                local ok, err = pcall(require, "cont.metrics")
                if not ok then
                    ngx.log(ngx.ERR, "cont.metrics failed: ", err)
                end
                ngx.exit(ngx.OK)
            }
        }

        # Cont: Proxy (all other routes — plugin chain)
        location / {
            # 1. rewrite: URL normalization
            rewrite_by_lua_block {
                local ok, err = pcall(require, "cont.rewrite")
                if not ok then
                    ngx.log(ngx.ERR, "cont.rewrite failed: ", err)
                end
            }

            # 2. access: plugin chain (auth, rate-limit, etc.)
            access_by_lua_block {
                local ok, err = pcall(require, "cont.access")
                if not ok then
                    ngx.log(ngx.ERR, "cont.access failed: ", err)
                end
            }

            # 3. proxy
            proxy_pass $cont_upstream;
            proxy_set_header Host $cont_upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 4. header_filter: plugin chain
            header_filter_by_lua_block {
                local ok, err = pcall(require, "cont.header_filter")
                if not ok then
                    ngx.log(ngx.ERR, "cont.header_filter failed: ", err)
                end
            }

            # 5. body_filter: plugin chain
            body_filter_by_lua_block {
                local ok, err = pcall(require, "cont.body_filter")
                if not ok then
                    -- silently ignore body_filter errors
                end
            }

            # 6. log: plugin chain + metrics
            log_by_lua_block {
                local ok, err = pcall(require, "cont.log")
                if not ok then
                    ngx.log(ngx.ERR, "cont.log failed: ", err)
                end
            }
        }
    }
}
