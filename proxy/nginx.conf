# nginx.conf — cont Gateway
# OpenResty-based reverse proxy with Lua plugin chain

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    send_timeout 60s;
    keepalive_requests 1000;
    keepalive_timeout 65s;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript;

    # Cont: shared memory zones for metrics, rate limiting, and proxy cache
    lua_shared_dict cont_metrics 10m;
    lua_shared_dict cont_rate_limit 10m;
    lua_shared_dict cont_proxy_cache 50m;
    lua_shared_dict cont_circuit_breaker_config 1m;
    lua_shared_dict cont_circuit_breaker_state 1m;

    # Cont: custom variable for trace ID (declared at http level via map)
    map $http_x_cont_trace_id $cont_trace_id {
        default "";
        ~.+ $http_x_cont_trace_id;
    }

    # Cont: init Lua modules (once at startup)
    init_by_lua_block {
        _G.cont = {
            services = {}, routes = {}, upstreams = {}, plugins = {}, targets = {},
            workers = {}, start_time = ngx.time(), config_loaded = false,
        }
    }

    # Per-worker init
    init_worker_by_lua_block {
        package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;" .. package.path
        local pid = ngx.worker.pid()
        if _G.cont then
            _G.cont.workers[pid] = {
                pid = pid,
                start_time = ngx.time(),
                requests = 0,
            }
        end

        -- Fetch config via cosocket in timer context (cosocket available in ngx.timer.at callbacks)
        local function fetch_config(premature, attempts)
            if premature then return end
            attempts = attempts or 0

            local sock = ngx.socket.tcp()
            sock:settimeout(3000)
            local ok, err = sock:connect("cont-admin-api", 8001)
            if not ok then
                ngx.log(ngx.WARN, "cont.sync[attempt ", attempts, "]: connect failed: ", err)
                if attempts < 5 then
                    ngx.timer.at(1, fetch_config, attempts + 1)
                else
                    ngx.log(ngx.ERR, "cont.sync: all 5 attempts exhausted, config not loaded")
                end
                return
            end

            local req = "GET /internal/config/snapshot HTTP/1.1\r\nHost: cont-admin-api:8001\r\nAccept: */*\r\nConnection: close\r\n\r\n"
            local sent, err = sock:send(req)
            if not sent then
                ngx.log(ngx.ERR, "cont.sync: send failed: ", err)
                sock:close()
                if attempts < 5 then ngx.timer.at(1, fetch_config, attempts + 1) end
                return
            end

            local body, err = sock:receive("*a")
            sock:close()
            if not body or err then
                ngx.log(ngx.ERR, "cont.sync: receive failed: ", err)
                if attempts < 5 then ngx.timer.at(1, fetch_config, attempts + 1) end
                return
            end

            -- Extract JSON body from HTTP response (handle chunked or content-length)
            local body_start = body:find("\r\n\r\n")
            if not body_start then
                ngx.log(ngx.ERR, "cont.sync: no header/body separator found")
                if attempts < 5 then ngx.timer.at(1, fetch_config, attempts + 1) end
                return
            end
            local header_lines = body:sub(1, body_start)
            local raw_body = body:sub(body_start + 4)

            -- Check Content-Length first (most reliable)
            local content_len = nil
            for line in header_lines:gmatch("[^\r\n]+") do
                local v = line:match("^Content%-Length:%s*(%d+)")
                if v then content_len = tonumber(v); break end
            end

            if content_len then
                body = raw_body:sub(1, content_len)
            else
                -- Chunked transfer encoding: read all chunks and concatenate
                local chunks = {}
                local remaining = raw_body
                while true do
                    local size_line_end = remaining:find("\r\n")
                    if not size_line_end then break end
                    local chunk_size = tonumber(remaining:sub(1, size_line_end - 1), 16)
                    if not chunk_size or chunk_size == 0 then
                        remaining = remaining:sub(size_line_end + 2)
                        -- skip trailing headers after the final 0\r\n
                        break
                    end
                    local chunk_data = remaining:sub(size_line_end + 2, size_line_end + 1 + chunk_size)
                    table.insert(chunks, chunk_data)
                    remaining = remaining:sub(size_line_end + 2 + chunk_size + 2)
                end
                body = table.concat(chunks)
            end

            local ok_decode, data = pcall(require("cjson").decode, body)
            if not ok_decode or not data then
                ngx.log(ngx.ERR, "cont.sync: decode failed body_len=", #body,
                        " preview=", string.sub(body, 1, 80))
                if attempts < 5 then ngx.timer.at(1, fetch_config, attempts + 1) end
                return
            end

            -- Index services/upstreams/targets by ID for O(1) lookup
            local services_idx = {}
            for _, s in ipairs(data.services or {}) do services_idx[s.id] = s end
            local upstreams_idx = {}
            for _, u in ipairs(data.upstreams or {}) do upstreams_idx[u.id] = u end
            local targets_idx = {}
            for tid, tlist in pairs(data.targets or {}) do targets_idx[tid] = tlist end

            _G.cont.routes   = data.routes   or {}
            _G.cont.services  = services_idx
            _G.cont.upstreams = upstreams_idx
            _G.cont.plugins  = data.plugins   or {}
            _G.cont.targets  = targets_idx
            _G.cont.config_loaded = true

            ngx.log(ngx.WARN, "cont.sync: config loaded routes=", #_G.cont.routes,
                    " services=", #data.services, " upstreams=", #data.upstreams,
                    " (attempts=", attempts, ")")

            -- Periodic refresh every 10s (keeps proxy config in sync with Admin API)
            ngx.timer.every(10, function(prem)
                if premature then return end
                local s = ngx.socket.tcp()
                s:settimeout(3000)
                local ok, err = s:connect("cont-admin-api", 8001)
                if not ok then return end
                local req = "GET /internal/config/snapshot HTTP/1.1\r\nHost: cont-admin-api:8001\r\nAccept: */*\r\nConnection: close\r\n\r\n"
                local sent, se = s:send(req)
                if not sent then s:close(); return end
                local b = s:receive("*a")
                s:close()
                if not b then return end

                local bi = b:find("\r\n\r\n")
                if not bi then return end
                local header_block = b:sub(1, bi)
                local raw_body = b:sub(bi + 4)

                -- Check Content-Length first (most reliable)
                local content_len = nil
                for line in header_block:gmatch("[^\r\n]+") do
                    local v = line:match("^Content%-Length:%s*(%d+)")
                    if v then content_len = tonumber(v); break end
                end

                local body
                if content_len then
                    body = raw_body:sub(1, content_len)
                else
                    -- Chunked transfer encoding: read all chunks and concatenate
                    local chunks = {}
                    local remaining = raw_body
                    while true do
                        local size_line_end = remaining:find("\r\n")
                        if not size_line_end then break end
                        local chunk_size = tonumber(remaining:sub(1, size_line_end - 1), 16)
                        if not chunk_size or chunk_size == 0 then
                            -- end of chunks
                            break
                        end
                        local chunk_data = remaining:sub(size_line_end + 2, size_line_end + 1 + chunk_size)
                        table.insert(chunks, chunk_data)
                        remaining = remaining:sub(size_line_end + 2 + chunk_size + 2)
                    end
                    body = table.concat(chunks)
                end

                if body then
                    local ok_d, dat = pcall(require("cjson").decode, body)
                    if ok_d and dat then
                        local si, ui, ti = {}, {}, {}
                        for _, s2 in ipairs(dat.services  or {}) do si[s2.id] = s2 end
                        for _, u2  in ipairs(dat.upstreams or {}) do ui[u2.id] = u2  end
                        for tid2, tl in pairs(dat.targets   or {}) do ti[tid2] = tl    end
                        _G.cont.routes   = dat.routes   or _G.cont.routes
                        _G.cont.services = si
                        _G.cont.upstreams= ui
                        _G.cont.plugins  = dat.plugins  or _G.cont.plugins
                        _G.cont.targets  = ti
                        ngx.log(ngx.INFO, "cont.refresh: ok routes=", #_G.cont.routes)
                    end
                end
            end)
        end

        ngx.timer.at(0, fetch_config, 0)
    }

    # Cont: Admin API upstream
    # NOTE: use resolver in server block to handle Docker DNS dynamic resolution
    # For static resolution, we rely on /etc/hosts inside the container
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;
        server_name _;

        # Cont: declare custom variables to avoid "not found for writing" errors
        set $cont_upstream '';
        set $cont_upstream_host '_';
        set $cont_internal '';
        set $cont_trace_id '';

        # Docker DNS resolver for dynamic service discovery
        resolver 127.0.0.11 valid=5s ipv6=off;

        # CORS preflight — exact match /
        location = / {
            access_by_lua_block {
                local method = ngx.req.get_method()
                if method == "OPTIONS" then
                    local origin = ngx.var.http_origin or "*"
                    ngx.header["Access-Control-Allow-Origin"] = origin
                    ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                    ngx.header["Access-Control-Allow-Headers"] = "Content-Type, Authorization, Kong-Admin-Token, X-API-Key, X-Requested-With"
                    ngx.header["Access-Control-Allow-Credentials"] = "true"
                    ngx.header["Access-Control-Max-Age"] = "86400"
                    ngx.status = 204
                    ngx.exit(204)
                end
            }
            # Not OPTIONS — fall through to proxy
            content_by_lua_block { ngx.exit(ngx.OK) }
        }

        # Cont: Internal Admin API proxy (for ngx.location.capture subrequests)
        location /__cont_admin__ {
            internal;
            set $cont_admin_host cont-admin-api:8001;
            proxy_pass http://$cont_admin_host/internal/config/snapshot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Kong-Admin-Token changeme;
            proxy_set_header X-Cont-Trace-ID $http_x_cont_trace_id;
        }
# Cont: Internal Admin API proxy (for ngx.location.capture subrequests)
        location /__cont_api_internal__ {
            set $cont_internal 1;
            set $admin_api cont-admin-api:8001;
            rewrite ^/__cont_api_internal__(.*) $1 break;
            proxy_pass http://$admin_api$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Kong-Admin-Token changeme;
            proxy_set_header X-Cont-Trace-ID $http_x_cont_trace_id;
        }

        # Cont: Admin API proxy (/cont-admin/* → cont-admin-api:8001)
        location ~ ^/cont-admin/(?<cont_path>.*) {
            set $admin_api cont-admin-api:8001;
            proxy_pass http://$admin_api/$cont_path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Kong-Admin-Token changeme;
            proxy_set_header X-Cont-Trace-ID $http_x_cont_trace_id;
        }

        # Cont: Admin API proxy (/api/* → cont-admin-api:8001/*)
        # Frontend vite proxy sends /api/* → Admin API root (no /api prefix on backend)
        location ~ ^/api/(?<api_path>.*) {
            set $admin_api cont-admin-api:8001;
            proxy_pass http://$admin_api/$api_path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Kong-Admin-Token changeme;
            proxy_set_header X-Cont-Trace-ID $http_x_cont_trace_id;
        }

        # Cont: /status (Kong-compatible)
        location = /status {
            access_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "status")
                if not ok then
                    ngx.log(ngx.ERR, "cont.status require failed: ", err)
                end
            }
            content_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, h = pcall(require, "status")
                if not ok or type(h) ~= "function" then
                    ngx.log(ngx.ERR, "cont.status failed: ", ok, h)
                    ngx.status = 500
                    ngx.say('{"message":"status handler error"}')
                else
                    h()
                end
            }
            header_filter_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
            }
            log_by_lua_block {
                -- metrics done in log phase
            }
        }

        # Cont: /metrics (Prometheus)
        location = /metrics {
            header_filter_by_lua_block {
                ngx.header["Content-Type"] = "text/plain; version=0.0.4"
            }
            content_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, h = pcall(require, "metrics")
                if not ok or type(h) ~= "function" then
                    ngx.log(ngx.ERR, "cont.metrics failed: ", ok, h)
                    ngx.status = 500
                    ngx.say('{"message":"metrics handler error"}')
                else
                    h()
                end
            }
            log_by_lua_block {
                -- noop
            }
        }

        # Cont: Proxy (all other routes — inline route matching + proxy)
        location / {
            # 0. Set Lua package path
            set_by_lua_block $lua_package_path {
                return "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;./?.lua;./?/init.lua;"
            }

            # Cont: init cache variables (avoid "not found for writing" errors)
            set $cont_cache_key '';
            set $cont_cache_hit '0';

            # 1. rewrite: URL normalization
            rewrite_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "rewrite")
                if not ok then
                    ngx.log(ngx.ERR, "cont.rewrite failed: ", err)
                end
            }
            # 2. access: INLINED route matching + upstream selection (avoids require() loop)
            access_by_lua_block {
                local uri = ngx.var.uri
                -- Skip internal subrequests
                if uri and string.find(uri, "^/__cont_api_internal__") then
                    return
                end

                -- Config is loaded once in init_worker_by_lua; access_by_lua only reads it
                if not _G.cont.config_loaded then
                    ngx.status = 503
                    ngx.say('{"message":"config not loaded","error":"Service Unavailable","statusCode":503}')
                    ngx.exit(503)
                end

                -- OPTIONS preflight
                local method = ngx.req.get_method()
                if method == "OPTIONS" then
                    local origin = ngx.var.http_origin or "*"
                    ngx.header["Access-Control-Allow-Origin"] = origin
                    ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                    ngx.header["Access-Control-Allow-Headers"] = "Content-Type, Authorization, Kong-Admin-Token, X-API-Key, X-Requested-With"
                    ngx.header["Access-Control-Allow-Credentials"] = "true"
                    ngx.header["Access-Control-Max-Age"] = "86400"
                    ngx.status = 204
                    ngx.exit(204)
                end

                -- Generate trace ID
                local trace_id = ngx.var.http_x_cont_trace_id
                if not trace_id or trace_id == "" then
                    local chars = "0123456789abcdef"
                    local id = {}
                    for i = 1, 32 do id[i] = chars:sub(math.random(1, 16), 16) end
                    trace_id = table.concat(id)
                end
                ngx.header["X-Cont-Trace-ID"] = trace_id

                -- Get cont config
                local cont = _G.cont or {}
                ngx.log(ngx.WARN, "DEBUG: routes_count=", #(cont.routes or {}), " services_count=", cont.services and "indexed" or "nil", " targets_type=", type(cont.targets))

                -- Route matching
                local host = ngx.var.http_host
                local path = ngx.var.uri
                local matched_route = nil
                local highest_priority = -1

                for _, route in ipairs(cont.routes or {}) do
                    if route.enabled == false then goto route_continue end

                    -- Protocol check
                    if route.protocols then
                        local proto_match = false
                        for _, proto in ipairs(route.protocols) do
                            if proto == "http" or proto == "https" then
                                proto_match = true; break
                            end
                        end
                        if not proto_match then goto route_continue end
                    end

                    -- Method match
                    if route.methods and #route.methods > 0 then
                        local method_match = false
                        for _, m in ipairs(route.methods) do
                            if m == method then method_match = true; break end
                        end
                        if not method_match then goto route_continue end
                    end

                    -- Host match
                    if route.hosts and #route.hosts > 0 then
                        local host_match = false
                        for _, h in ipairs(route.hosts) do
                            if h == host or (string.find(h, "%*.") == 1 and string.sub(host, #h - string.find(h, "%*.") + 2) == string.sub(h, 3)) then
                                host_match = true; break
                            end
                        end
                        if not host_match then goto route_continue end
                    end

                    -- Path match (prefix)
                    if route.paths and #route.paths > 0 then
                        local path_match = false
                        for _, p in ipairs(route.paths) do
                            if string.sub(path, 1, string.len(p)) == p then
                                path_match = true; break
                            end
                        end
                        if not path_match then goto route_continue end
                    end

                    local priority = route.regex_priority or 0
                    if priority > highest_priority then
                        highest_priority = priority
                        matched_route = route
                    end

                    ::route_continue::
                end

                if not matched_route then
                    ngx.status = 404
                    ngx.say('{"message":"no route matched","error":"Not Found","statusCode":404}')
                    ngx.exit(404)
                end

                ngx.ctx.matched_route = matched_route
                ngx.ctx.route_id = matched_route.id

                -- Service lookup: route may have service_id (flat) or service.id (nested)
                local service_id = matched_route.service_id
                    or (matched_route.service and matched_route.service.id)
                local service = service_id and cont.services[service_id]

                if not service then
                    ngx.log(ngx.WARN, "cont: service lookup failed sid=", service_id, " service_count=", #cont.services)
                    ngx.status = 503
                    ngx.say('{"message":"service not found","error":"Service Unavailable","statusCode":503}')
                    ngx.exit(503)
                end

                ngx.ctx.service_id = service_id
                ngx.ctx.service = service

                -- JWT auth check (same logic as access.lua lines 293-328)
                local has_jwt = false
                for _, p in ipairs(cont.plugins or {}) do
                    if p.name == "jwt" then
                        -- Global plugin (no route_id and no service_id) OR attached to this route/service
                        local is_global = (not p.route_id and not p.service_id)
                        if is_global or p.route_id == matched_route.id or p.service_id == service_id then
                            has_jwt = true
                            break
                        end
                    end
                end
                if has_jwt then
                    local auth_hdr = ngx.var.http_authorization or ""
                    local token = nil
                    if string.sub(auth_hdr, 1, 7) == "Bearer " then
                        token = auth_hdr:sub(8)
                    elseif ngx.var.http_x_auth_token then
                        token = ngx.var.http_x_auth_token
                    end
                    if token then
                        local jv = require("jwt_validation")
                        local consumer_id, user_id = jv.validate_jwt(token)
                        if consumer_id then
                            ngx.ctx.authenticated_consumer_id = consumer_id
                            ngx.ctx.authenticated_user_id = user_id
                        else
                            ngx.header["WWW-Authenticate"] = 'Bearer realm="API"'
                            ngx.status = 401
                            ngx.say('{"message":"Invalid or expired JWT token","error":"Unauthorized","statusCode":401}')
                            return ngx.exit(401)
                        end
                    else
                        ngx.header["WWW-Authenticate"] = 'Bearer realm="API"'
                        ngx.status = 401
                        ngx.say('{"message":"No JWT token provided","error":"Unauthorized","statusCode":401}')
                        return ngx.exit(401)
                    end
                end

                -- Select upstream target
                local upstream_target = nil

                if service.host then
                    -- Direct host:port (no upstream)
                    upstream_target = service.host .. ":" .. (service.port or 80)

                elseif service.upstream_id then
                    -- Use upstream + targets
                    local targets = cont.targets and cont.targets[service.upstream_id]
                    ngx.log(ngx.WARN, "DEBUG targets: upstream_id=", service.upstream_id, " targets_type=", type(targets), " targets_len=", targets and #targets or "nil")
                    if not targets or type(targets) ~= "table" or #targets == 0 then
                        ngx.status = 503
                        ngx.say('{"message":"no healthy upstream targets","error":"Service Unavailable","statusCode":503}')
                        ngx.exit(503)
                    end

                    local upstream = cont.upstreams and cont.upstreams[service.upstream_id]
                    local algorithm = upstream and upstream.algorithm or "roundrobin"
                    local selected_target = nil

                    if algorithm == "roundrobin" then
                        local total = 0
                        for _, t in ipairs(targets) do total = total + t.weight end
                        local rand = math.random(total)
                        local cumulative = 0
                        for _, t in ipairs(targets) do
                            cumulative = cumulative + t.weight
                            if rand <= cumulative then selected_target = t.target; break end
                        end
                        if not selected_target then selected_target = targets[1].target end
                    else
                        selected_target = targets[1].target
                    end

                    upstream_target = selected_target
                end
                ngx.log(ngx.WARN, "DEBUG: upstream_target=", upstream_target)
                if not upstream_target then
                    ngx.status = 503
                    ngx.say('{"message":"no upstream target","error":"Service Unavailable","statusCode":503}')
                    ngx.exit(503)
                end

                -- Strip route prefix if strip_path enabled
                local final_uri = ngx.var.uri
                if matched_route.strip_path and matched_route.paths and #matched_route.paths > 0 then
                    local prefix = matched_route.paths[1]
                    if string.sub(final_uri, 1, string.len(prefix)) == prefix then
                        final_uri = string.sub(final_uri, string.len(prefix) + 1)
                        if final_uri == "" then final_uri = "/" end
                    end
                end

                ngx.ctx.upstream_target = upstream_target
                ngx.ctx.stripped_uri = final_uri
                ngx.var.cont_upstream = upstream_target
                ngx.log(ngx.WARN, "cont: upstream_target=", upstream_target)
            }

            # 3. proxy — upstream target set via $cont_upstream variable
            set $admin_api cont-admin-api:8001;
            proxy_http_version 1.1;
            proxy_pass http://$cont_upstream$is_args$args;
            proxy_set_header Host $cont_upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Cont-Upstream $cont_upstream;
            proxy_set_header X-GRPC-Web $http_x_grpc_web;
            proxy_set_header Connection "";

            # 4. header_filter: plugin chain
            header_filter_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, hf = pcall(require, "header_filter")
                if ok and hf then
                    pcall(hf)
                else
                    ngx.log(ngx.ERR, "cont.header_filter failed: ", hf)
                end
            }

            # 5. body_filter: plugin chain (proxy-cache stores response here)
            body_filter_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "body_filter")
                if not ok then
                    -- silently ignore body_filter errors
                end
            }

            # 6. log: plugin chain + metrics
            log_by_lua_block {
                package.path = "/usr/local/openresty/lualib/cont/?.lua;/usr/local/openresty/lualib/cont/?/init.lua;;"
                local ok, err = pcall(require, "log")
                if not ok then
                    ngx.log(ngx.ERR, "cont.log failed: ", err)
                end
            }
        }
    }
}
