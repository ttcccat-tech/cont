input {
  beats {
    port => 5044
    ssl => false
  }
}

filter {
  if [log_type] == "cont_access" {
    # 確保 timestamp 是正確的 epoch millis
    ruby {
      code => '
        ts = event.get("timestamp")
        if ts
          # 如果是毫秒epoch（> 1e12），轉成秒
          if ts.to_f > 1e12
            event.set("@timestamp", Time.at(ts.to_f / 1000).utc)
          elsif ts.to_f > 1e9
            event.set("@timestamp", Time.at(ts.to_f).utc)
          end
        else
          event.set("@timestamp", Time.now.utc)
        end
      '
    }

    # 解析 request uri（去除query string）
    mutate {
      add_field => { "request_path" => "%{[request][uri]}" }
    }
    if [request][query] {
      mutate {
        gsub => [
          "request_path", "\?.*$", ""
        ]
      }
    }

    # 把 route_id / service_id / consumer_id 命名為 elasticsearch 適合的欄位
    mutate {
      rename => {
        "route_id"    => "cont_route_id"
        "service_id"  => "cont_service_id"
        "consumer_id" => "cont_consumer_id"
        "upstream"    => "cont_upstream"
      }
    }

    # 加入人性化時間欄位
    ruby {
      code => '
        t = event.get("@timestamp")
        if t
          event.set("time_iso8601", t.strftime("%Y-%m-%dT%H:%M:%SZ"))
        end
      '
    }

    # 移除不需要的欄位
    mutate {
      remove_field => ["host", "agent", "ecs", "input", "log"]
    }
  }
}

output {
  if [log_type] == "cont_access" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "cont-access-%{+YYYY.MM.dd}"
      user => ""
      password => ""
      ssl => false
    }
  }
}
