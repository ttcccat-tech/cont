# Production overrides for cont Gateway
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    # Enable WAL archiving for point-in-time recovery
    command: >
      postgres
      -c max_wal_senders=3
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='/bin/true'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

  redis:
    # Enable AOF persistence for production
    command: redis-server --appendonly yes --appendfsync everysec

  admin-api:
    restart: always
    # Production should always enforce JWT_SECRET
    environment:
      ADMIN_PORT: "8001"
      API_PORT: "8001"
      PROXY_PORT: "8000"
      POSTGRES_URL: "${POSTGRES_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_SECRET: "${JWT_SECRET}"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  proxy:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  frontend:
    restart: always

# Production networks
networks:
  cont_default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16