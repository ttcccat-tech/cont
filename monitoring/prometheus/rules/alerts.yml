# Cont API Gateway Alerting Rules
groups:
  - name: cont_alerts
    rules:
      # High Error Rate — 5xx errors > 5% over 5 minutes
      - alert: ContHighErrorRate
        expr: |
          cont_nginx_requests_total{code="5xx"}
          /
          (cont_nginx_requests_total{code="2xx"} + cont_nginx_requests_total{code="3xx"} + cont_nginx_requests_total{code="4xx"} + cont_nginx_requests_total{code="5xx"}) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cont API high 5xx error rate"
          description: "5xx error rate is over 5% over the last 5 minutes"

      # High Latency — p95 > 2s (using histogram_quantile on custom latency metric)
      - alert: ContHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(cont_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Cont API high latency"
          description: "p95 latency is over 2 seconds"

      # High Upstream Latency — p95 > 5s
      - alert: ContHighUpstreamLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(cont_upstream_latency_seconds_bucket[5m])) by (le)
          ) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Cont upstream high latency"
          description: "p95 upstream latency is over 5 seconds"

      # High Memory Usage (if Admin API exposes memory metrics via promhttp)
      - alert: ContHighMemoryUsage
        expr: (process_resident_memory_bytes / process_resident_memory_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cont high memory usage"
          description: "Memory usage is over 85%"

      # Service Down — no requests accepted
      - alert: ContServiceDown
        expr: cont_nginx_requests_total == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cont proxy receiving no traffic"
          description: "No requests in the last 5 minutes — service may be down"
