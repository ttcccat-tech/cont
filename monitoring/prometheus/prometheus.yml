# Prometheus scrape configuration for Cont
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Cont Admin API metrics (Go + Gin default metrics via promhttp)
  - job_name: 'cont-admin-api'
    static_configs:
      - targets: ['cont-admin-api:8001']
    metrics_path: /metrics
    scrape_interval: 10s

  # Cont Proxy (OpenResty) custom metrics — direct scrape
  # The proxy exposes /metrics on port 8000 (nginx.conf)
  - job_name: 'cont-proxy'
    static_configs:
      - targets: ['cont-proxy:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
