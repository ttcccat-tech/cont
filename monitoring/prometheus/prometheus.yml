# Prometheus scrape configuration for Cont
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Cont Admin API metrics
  - job_name: 'cont-admin-api'
    static_configs:
      - targets: ['cont-admin-api:8001']
    metrics_path: /metrics
    scrape_interval: 10s

  # Cont Proxy (OpenResty) metrics via admin-api
  - job_name: 'cont-proxy'
    static_configs:
      - targets: ['cont-admin-api:8001']
    metrics_path: /metrics
    scrape_interval: 10s
    # Labels to differentiate from admin-api
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'cont-proxy'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']